<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROOM™ — IA d'Accueil</title>

<style>
    body {
        margin: 0;
        background: #000814;
        font-family: Arial, sans-serif;
        color: #bcdfff;
        overflow: hidden;
        text-align: center;
    }

    /* Effet lignes futuristes */
    .line {
        position: fixed;
        width: 2px;
        height: 120vh;
        background: rgba(0,150,255,0.45);
        box-shadow: 0 0 15px #009dff;
        animation: drop 5s linear infinite;
        z-index: -1;
    }

    @keyframes drop {
        0% { transform: translateY(-150vh); opacity: 0; }
        15% { opacity: 1; }
        100% { transform: translateY(150vh); opacity: 0; }
    }

    h1 {
        margin-top: 90px;
        font-size: 42px;
        color: #4aa8ff;
        text-shadow: 0 0 18px #4aa8ff, 0 0 35px #008cff;
    }

    #textIA {
        margin: 25px auto;
        width: 90%;
        max-width: 700px;
        font-size: 16px;
        line-height: 1.6;
        text-shadow: 0 0 10px #008cff;
        min-height: 180px;
    }

    /* Bouton */
    .btn {
        margin-top: 40px;
        padding: 16px 45px;
        font-size: 20px;
        background: #008cff;
        border: none;
        border-radius: 10px;
        color: #fff;
        box-shadow: 0 0 22px #009dff;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        transform: scale(1.10);
        box-shadow: 0 0 35px #00c3ff;
    }
</style>
</head>

<body>

<!-- Effet lignes -->
<script>
for (let i = 0; i < 26; i++) {
    let l = document.createElement("div");
    l.className = "line";
    l.style.left = Math.random() * 100 + "%";
    l.style.animationDelay = (Math.random() * 5) + "s";
    document.body.appendChild(l);
}
</script>

<!-- AUDIO AUTOMATIQUE (iPhone compatible) -->
<audio id="voice" autoplay muted>
    <source src="intro.mp3" type="audio/mpeg">
</audio>

<script>
setTimeout(() => {
    const audio = document.getElementById("voice");
    audio.muted = false;
    audio.play().catch(() => {});
}, 600);
</script>

<h1>Bienvenue dans GROOM™</h1>

<div id="textIA"></div>

<script>
const txt = `
Initialisation du système GROOM™...
Analyse Élít CSP en cours...
Modules activés.

Votre interface GROOM™ est maintenant prête.

Je suis Groom, votre IA d’accompagnement.
Je vais vous guider étape par étape dans le lancement de votre business.
Préparez-vous à entrer dans un système conçu pour détecter vos opportunités,
analyser vos chances de réussite et vous orienter vers la voie la plus rentable.
`;

let i = 0;
const speed = 22;

function typeText() {
    if (i < txt.length) {
        document.getElementById("textIA").innerHTML += txt.charAt(i);
        i++;
        setTimeout(typeText, speed);
    }
}
typeText();
</script>

<!-- BOUTON AVEC TON LIEN -->
<button class="btn" onclick="window.location.href='https://ecomacademyproo.github.io/progetElite-/'">
    COMMENCER →
</button>

</body>
</html>
